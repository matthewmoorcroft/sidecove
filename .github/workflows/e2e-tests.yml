name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser and system deps
        run: npx puppeteer browsers install chrome

      # The upgrade test installs the latest published release, then updates it to this build.
      - name: Build the latest release for the upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No release in $GITHUB_REPOSITORY (a fork?): the upgrade test relabels this build instead."
            exit 0
          fi
          echo "Latest release: $TAG"
          git fetch --depth=1 origin tag "$TAG"
          mkdir -p "$RUNNER_TEMP/sidecove-previous"
          git archive "$TAG" | tar -x -C "$RUNNER_TEMP/sidecove-previous"
          cd "$RUNNER_TEMP/sidecove-previous"
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci
          npm run build
          echo "SIDECOVE_PREVIOUS_BUILD=$RUNNER_TEMP/sidecove-previous/dist" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: npm test
        env:
          CI: true

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
