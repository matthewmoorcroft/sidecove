name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser and system deps
        run: npx puppeteer browsers install chrome

      # The upgrade test installs each of these releases, then updates it to this build: the
      # latest release, and 1.1.0, the oldest one users may still be updating from.
      - name: Build earlier releases for the upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERRORS="$RUNNER_TEMP/release-error.txt"
          if ! TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>"$ERRORS"); then
            grep -q 'release not found' "$ERRORS" || { cat "$ERRORS"; exit 1; }
            echo "No release in $GITHUB_REPOSITORY (a fork?): building v1.1.0 only."
            TAG=""
          fi
          BUILDS=""
          for RELEASE in $(printf '%s\n' $TAG v1.1.0 | sort -u); do
            echo "Building $RELEASE"
            git fetch --depth=1 origin tag "$RELEASE"
            mkdir -p "$RUNNER_TEMP/sidecove-$RELEASE"
            git archive "$RELEASE" | tar -x -C "$RUNNER_TEMP/sidecove-$RELEASE"
            (cd "$RUNNER_TEMP/sidecove-$RELEASE" && PUPPETEER_SKIP_DOWNLOAD=1 npm ci && npm run build)
            BUILDS="${BUILDS:+$BUILDS:}$RUNNER_TEMP/sidecove-$RELEASE/dist"
          done
          echo "SIDECOVE_PREVIOUS_BUILD=$BUILDS" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: npm test
        env:
          CI: true

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
