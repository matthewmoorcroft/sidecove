name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension (production)
        run: npm run build

      - name: Unit regression tests
        run: npm run test:unit

      - name: Favorite identity and independent space browser regressions
        run: NODE_OPTIONS='--experimental-vm-modules' npx jest --config jest.config.js tests/e2e/favorite-identity.test.js tests/e2e/independent-spaces.test.js --runInBand

      - name: Create zip package
        run: npm run zip

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          ls -la *.zip

          echo "Verifying manifest.json exists in both builds..."
          test -f dist/manifest.json

          echo "Verifying main files exist..."
          test -f dist/background.js
          test -f dist/sidebar.js
          test -f dist/sidebar.html

          echo "✅ All build artifacts verified!"

      - name: Upload build artifacts (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-build
          path: |
            dist/
            *.zip
          retention-days: 7
