name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension (production)
        run: npm run build

      - name: Unit regression tests
        run: npm run test:unit

      - name: Favorite identity and independent space browser regressions
        run: NODE_OPTIONS='--experimental-vm-modules' npx jest --config jest.config.js tests/e2e/favorite-identity.test.js tests/e2e/independent-spaces.test.js --runInBand

      - name: Create zip package
        run: npm run zip

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          ls -la *.zip

          echo "Verifying manifest.json exists in both builds..."
          test -f dist/manifest.json

          echo "Verifying main files exist..."
          test -f dist/background.js
          test -f dist/sidebar.js
          test -f dist/sidebar.html

          echo "✅ All build artifacts verified!"

      - name: Upload build artifacts (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-build
          path: |
            dist/
            *.zip
          retention-days: 7
